name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Log in to GitHub Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run coolify-deploy
        env:
          COOLIFY_ENDPOINT_URL: ${{ secrets.COOLIFY_ENDPOINT_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          MANIFEST_PATH: ./coolify.manifest.json
          COOLIFY_ENV_PAIDEUO: ${{ secrets.COOLIFY_ENV_PAIDEUO }}
          LOG_LEVEL: debug
        run: |
          if [ -z "$COOLIFY_ENDPOINT_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Warning: COOLIFY_ENDPOINT_URL or COOLIFY_TOKEN not set, skipping deployment"
            exit 0
          fi
          echo $"Using COOLIFY_ENDPOINT_URL: $COOLIFY_ENDPOINT_URL"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "Warning: Manifest file not found at $MANIFEST_PATH, skipping deployment"
            exit 0
          fi
          npx coolify-deploy --manifest "$MANIFEST_PATH" apply --tag "${{ steps.sha.outputs.sha }}"

  deploy-hooks:
    name: Deploy PocketBase Hooks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect hook changes
        id: detect
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          tags_pattern: 'v*.*.*'
          files: backend/pb_hooks/**

      - name: Setup SSH key
        if: steps.detect.outputs.any_modified == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PB_DEPLOY_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PB_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync hooks to PocketBase container
        if: steps.detect.outputs.any_modified == 'true'
        run: |
          # Copy hooks to container via SSH + Docker
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.PB_DEPLOY_USER }}@${{ secrets.PB_DEPLOY_HOST }}" \
            "docker cp - ${{ secrets.PB_CONTAINER_NAME }}:/app/pb_hooks" \
            < <(tar -cf - -C backend pb_hooks)

          echo "✓ Hooks synchronized to ${{ secrets.PB_CONTAINER_NAME }}"

      - name: Restart PocketBase container
        if: steps.detect.outputs.any_modified == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.PB_DEPLOY_USER }}@${{ secrets.PB_DEPLOY_HOST }}" \
            "docker restart ${{ secrets.PB_CONTAINER_NAME }}"

          echo "✓ Container restarted to load new hooks"
          sleep 5

          # Verify container is running
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.PB_DEPLOY_USER }}@${{ secrets.PB_DEPLOY_HOST }}" \
            "docker exec ${{ secrets.PB_CONTAINER_NAME }} pocketbase --version 2>&1 | head -1 || echo 'Container status: running'"

      - name: Verify hook deployment
        if: steps.detect.outputs.any_modified == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.PB_DEPLOY_USER }}@${{ secrets.PB_DEPLOY_HOST }}" \
            "docker exec ${{ secrets.PB_CONTAINER_NAME }} ls -la /app/pb_hooks | head -20"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
